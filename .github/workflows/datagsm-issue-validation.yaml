name: DataGSM Issue Validation Workflow

on:
  issues:
    types: [opened, edited]

jobs:
  validate-title:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Validation Script
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Validate Issue Title
        uses: actions/github-script@v9
        with:
          script: |
            const validateTitle = require('./.github/scripts/validate-title.js');
            validateTitle({ core, title: context.payload.issue.title });
