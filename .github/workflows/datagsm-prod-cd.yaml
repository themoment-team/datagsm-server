name: DataGSM prod CD workflow

on:
  workflow_run:
    workflows: ["DataGSM prod CI Workflow"]
    types:
      - completed
    branches:
      - 'master'
  push:
    branches: [master]
    paths:
      - 'datagsm-common/src/main/kotlin/**/dto/**'
      - 'datagsm-common/src/main/kotlin/**/constant/**'
      - 'datagsm-ksp-processor/**'
      - 'datagsm-shared/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: false
        default: 'master'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        run: |
          DATE=$(date +'%Y%m%d')
          echo "value=${DATE}-${{ github.run_number }}" >> $GITHUB_OUTPUT

  publish-jvm:
    needs: generate-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true
      - name: Setup JDK for mvn deploy
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Publish JVM artifact to GitHub Packages
        # --//bazel:kt_jvm_target=17 emits JVM 17 bytecode (SDK consumer floor), not the
        # default JVM 25 the service modules use.
        run: bazel run //datagsm-shared:publish --//bazel:kt_jvm_target=17 -- ${{ needs.generate-version.outputs.version }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-js:
    needs: generate-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Assemble type-only npm package
        run: |
          bazel build //datagsm-shared:ts_package
          mkdir -p npm-pkg && cp bazel-bin/datagsm-shared/npm/index.d.ts bazel-bin/datagsm-shared/npm/package.json npm-pkg/
          # npm requires semver; CI passes "<yyyyMMdd>-<run>" → normalize to "<yyyyMMdd>.0.0-<run>".
          RAW="${{ needs.generate-version.outputs.version }}"
          NPM_VERSION=$(echo "$RAW" | sed -E 's/^([0-9]+)-([0-9]+)$/\1.0.0-\2/')
          cd npm-pkg && npm version "$NPM_VERSION" --no-git-tag-version --allow-same-version
      - name: Publish to npmjs.com
        run: npm publish --access public
        working-directory: npm-pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  CD:
    runs-on: ubuntu-latest
    environment: prod
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.event.workflow_run.head_branch || 'master' }}

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      - name: Make YML Files
        run: |
          mkdir -p ./datagsm-oauth-authorization/src/main/resources
          mkdir -p ./datagsm-web/src/main/resources
          mkdir -p ./datagsm-openapi/src/main/resources
          mkdir -p ./datagsm-oauth-userinfo/src/main/resources

          touch ./datagsm-oauth-authorization/src/main/resources/application-prod.yml
          echo "${{ secrets.PROD_OAUTH_AUTHORIZATION_APPLICATION_YAML }}" > ./datagsm-oauth-authorization/src/main/resources/application-prod.yml

          touch ./datagsm-web/src/main/resources/application-prod.yml
          echo "${{ secrets.PROD_WEB_APPLICATION_YAML }}" > ./datagsm-web/src/main/resources/application-prod.yml

          touch ./datagsm-openapi/src/main/resources/application-prod.yml
          echo "${{ secrets.PROD_OPENAPI_APPLICATION_YAML }}" > ./datagsm-openapi/src/main/resources/application-prod.yml

          touch ./datagsm-oauth-userinfo/src/main/resources/application-prod.yml
          echo "${{ secrets.PROD_OAUTH_USERINFO_APPLICATION_YAML }}" > ./datagsm-oauth-userinfo/src/main/resources/application-prod.yml
        shell: bash

      - name: Build with Bazel
        run: >
          bazel build
          //datagsm-oauth-authorization:oauth-authorization_deploy_tar
          //datagsm-openapi:openapi_deploy_tar
          //datagsm-web:web_deploy_tar
          //datagsm-oauth-userinfo:oauth-userinfo_deploy_tar

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Make ZIP File
        run: |
          mkdir -p deploy-package
          for m in datagsm-oauth-authorization datagsm-openapi datagsm-web datagsm-oauth-userinfo; do
            mkdir -p "deploy-package/$m"
            tar xf "bazel-bin/$m/${m#datagsm-}_deploy_tar.tar" -C "deploy-package/$m"
          done

          cp datagsm-oauth-authorization/prod.dockerfile deploy-package/datagsm-oauth-authorization/
          cp datagsm-openapi/prod.dockerfile deploy-package/datagsm-openapi/
          cp datagsm-web/prod.dockerfile deploy-package/datagsm-web/
          cp datagsm-oauth-userinfo/prod.dockerfile deploy-package/datagsm-oauth-userinfo/

          cp compose.prod.yaml deploy-package/
          cp -r scripts deploy-package/
          cp appspec.yml deploy-package/

          cd deploy-package
          zip -r ../$GITHUB_SHA.zip .
          cd ..
        shell: bash

      - name: Upload to S3
        run: aws s3 cp --region ${{ secrets.AWS_REGION }} ./$GITHUB_SHA.zip s3://${{ secrets.AWS_S3_BUCKET_NAME }}/prod/$GITHUB_SHA.zip

      - name: Code Deploy
        run: aws deploy create-deployment --application-name datagsm-prod-server-codedeploy --deployment-config-name CodeDeployDefault.AllAtOnce --deployment-group-name datagsm-prod-server --s3-location bucket=${{ secrets.AWS_S3_BUCKET_NAME }},bundleType=zip,key=prod/$GITHUB_SHA.zip

      - name: CD Success Notification
        uses: sarisia/actions-status-discord@v1
        if: success()
        with:
          webhook: ${{ secrets.DISCORD_INFORMATION_ALERT_CHANNEL_WEBHOOK }}
          color: 0x4CAF50

      - name: CD Failure Notification
        uses: sarisia/actions-status-discord@v1
        if: failure()
        with:
          webhook: ${{ secrets.DISCORD_INFORMATION_ALERT_CHANNEL_WEBHOOK }}
          color: 0xFF4C4C

      - name: CD Cancelled Notification
        uses: sarisia/actions-status-discord@v1
        if: cancelled()
        with:
          webhook: ${{ secrets.DISCORD_INFORMATION_ALERT_CHANNEL_WEBHOOK }}
          color: 0xFFA500
