name: DataGSM prod CD workflow

on:
  workflow_run:
    workflows: ["DataGSM prod CI Workflow"]
    types:
      - completed
    branches:
      - 'master'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: false
        default: 'master'
        type: string
      target:
        description: 'Deployment target'
        required: false
        default: 'deploy-server'
        type: choice
        options:
          - deploy-server
          - deploy-shared
          - both

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-version:
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'deploy-shared' || inputs.target == 'both')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      shared_changed: ${{ steps.changes.outputs.shared_changed }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.event.workflow_run.head_sha || 'master' }}
          fetch-depth: 0

      - name: Detect Shared Changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "shared_changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          CHANGED=$(git diff --name-only HEAD^1 HEAD)
          if echo "$CHANGED" | grep -qE '^(datagsm-common/src/main/kotlin/(.*/)?(dto|constant)/|datagsm-ksp-processor/|datagsm-shared/)'; then
            echo "shared_changed=true" >> $GITHUB_OUTPUT
          else
            echo "shared_changed=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Generate Version
        id: version
        run: |
          DATE=$(date +'%Y%m%d')
          echo "value=${DATE}-${{ github.run_number }}" >> $GITHUB_OUTPUT

  publish-jvm:
    needs: generate-version
    if: needs.generate-version.outputs.shared_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.event.workflow_run.head_sha || 'master' }}
      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
          cache-cleanup: always
      - name: Publish JVM artifact to GitHub Packages
        run: >
          ./gradlew :datagsm-common:kspKotlin
          :datagsm-shared:publishJvmPublicationToGitHubPackagesRepository
          -PSHARED_VERSION=${{ needs.generate-version.outputs.version }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-js:
    needs: generate-version
    if: needs.generate-version.outputs.shared_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.event.workflow_run.head_sha || 'master' }}
      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
          cache-cleanup: always
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Assemble type-only npm package
        run: >
          ./gradlew :datagsm-shared:assembleTsPackage
          -PSHARED_VERSION=${{ needs.generate-version.outputs.version }}
      - name: Publish to npmjs.com
        run: npm publish --access public
        working-directory: datagsm-shared/build/npm-ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    environment: prod
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'deploy-server' || inputs.target == 'both')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.event.workflow_run.head_sha || 'master' }}

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
          cache-cleanup: always

      - name: Make YML Files
        run: |
          mkdir -p ./datagsm-oauth-authorization/src/main/resources
          mkdir -p ./datagsm-web/src/main/resources
          mkdir -p ./datagsm-openapi/src/main/resources
          mkdir -p ./datagsm-oauth-userinfo/src/main/resources

          touch ./datagsm-oauth-authorization/src/main/resources/application-prod.yml
          echo "${{ secrets.PROD_OAUTH_AUTHORIZATION_APPLICATION_YAML }}" > ./datagsm-oauth-authorization/src/main/resources/application-prod.yml

          touch ./datagsm-web/src/main/resources/application-prod.yml
          echo "${{ secrets.PROD_WEB_APPLICATION_YAML }}" > ./datagsm-web/src/main/resources/application-prod.yml

          touch ./datagsm-openapi/src/main/resources/application-prod.yml
          echo "${{ secrets.PROD_OPENAPI_APPLICATION_YAML }}" > ./datagsm-openapi/src/main/resources/application-prod.yml

          touch ./datagsm-oauth-userinfo/src/main/resources/application-prod.yml
          echo "${{ secrets.PROD_OAUTH_USERINFO_APPLICATION_YAML }}" > ./datagsm-oauth-userinfo/src/main/resources/application-prod.yml
        shell: bash

      - name: Build with Gradle
        run: ./gradlew assemble

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Make ZIP File
        run: |
          mkdir -p deploy-package
          mkdir -p deploy-package/datagsm-oauth-authorization/build/libs
          mkdir -p deploy-package/datagsm-openapi/build/libs
          mkdir -p deploy-package/datagsm-web/build/libs
          mkdir -p deploy-package/datagsm-oauth-userinfo/build/libs

          cp datagsm-oauth-authorization/build/libs/*.jar deploy-package/datagsm-oauth-authorization/build/libs/
          cp datagsm-openapi/build/libs/*.jar deploy-package/datagsm-openapi/build/libs/
          cp datagsm-web/build/libs/*.jar deploy-package/datagsm-web/build/libs/
          cp datagsm-oauth-userinfo/build/libs/*.jar deploy-package/datagsm-oauth-userinfo/build/libs/

          cp datagsm-oauth-authorization/prod.dockerfile deploy-package/datagsm-oauth-authorization/
          cp datagsm-openapi/prod.dockerfile deploy-package/datagsm-openapi/
          cp datagsm-web/prod.dockerfile deploy-package/datagsm-web/
          cp datagsm-oauth-userinfo/prod.dockerfile deploy-package/datagsm-oauth-userinfo/

          cp compose.prod.yaml deploy-package/
          cp -r scripts deploy-package/
          cp appspec.yml deploy-package/

          cd deploy-package
          zip -r ../$GITHUB_SHA.zip .
          cd ..
        shell: bash

      - name: Upload to S3
        run: aws s3 cp --region ${{ secrets.AWS_REGION }} ./$GITHUB_SHA.zip s3://${{ secrets.AWS_S3_BUCKET_NAME }}/prod/$GITHUB_SHA.zip

      - name: Code Deploy
        run: aws deploy create-deployment --application-name datagsm-prod-server-codedeploy --deployment-config-name CodeDeployDefault.AllAtOnce --deployment-group-name datagsm-prod-server --s3-location bucket=${{ secrets.AWS_S3_BUCKET_NAME }},bundleType=zip,key=prod/$GITHUB_SHA.zip

      - name: Deploy Success Notification
        uses: sarisia/actions-status-discord@v1
        if: success()
        with:
          webhook: ${{ secrets.DISCORD_INFORMATION_ALERT_CHANNEL_WEBHOOK }}
          color: 0x4CAF50

      - name: Deploy Failure Notification
        uses: sarisia/actions-status-discord@v1
        if: failure()
        with:
          webhook: ${{ secrets.DISCORD_INFORMATION_ALERT_CHANNEL_WEBHOOK }}
          color: 0xFF4C4C

      - name: Deploy Cancelled Notification
        uses: sarisia/actions-status-discord@v1
        if: cancelled()
        with:
          webhook: ${{ secrets.DISCORD_INFORMATION_ALERT_CHANNEL_WEBHOOK }}
          color: 0xFFA500
