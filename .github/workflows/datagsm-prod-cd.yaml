name: DataGSM prod CD workflow

on:
  workflow_run:
    workflows: ["DataGSM CI Workflow"]
    types:
      - completed
    branches:
      - 'master'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: false
        default: 'master'
        type: string
      target:
        description: 'Deployment target'
        required: false
        default: 'deploy-server'
        type: choice
        options:
          - deploy-server
          - deploy-shared
          - both

# Never cancel a running prod deploy/publish midway; a newer run waits in the queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-version:
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'deploy-shared' || inputs.target == 'both')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      shared_changed: ${{ steps.changes.outputs.shared_changed }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.event.workflow_run.head_sha || 'master' }}
          fetch-depth: 0

      - name: Detect Shared Changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "shared_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only HEAD^1 HEAD)
          if echo "$CHANGED" | grep -qE '^(datagsm-common/src/main/kotlin/(.*/)?(dto|constant)/|datagsm-ksp-processor/|datagsm-shared/)'; then
            echo "shared_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "shared_changed=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Generate Version
        id: version
        run: |
          DATE=$(date +'%Y%m%d')
          echo "value=${DATE}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  publish-jvm:
    needs: generate-version
    if: needs.generate-version.outputs.shared_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.event.workflow_run.head_sha || 'master' }}
      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-cleanup: always
      # publishToMavenCentral uploads and validates only; the deployment is released from the
      # Central Portal by hand. Switch to publishAndReleaseToMavenCentral to release automatically.
      - name: Publish JVM artifact to Maven Central
        run: >
          ./gradlew :datagsm-common:kspKotlin
          :datagsm-shared:publishToMavenCentral
          -PSHARED_VERSION=${{ needs.generate-version.outputs.version }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

  publish-js:
    needs: generate-version
    if: needs.generate-version.outputs.shared_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.event.workflow_run.head_sha || 'master' }}
      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-cleanup: always
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest
      - name: Assemble type-only npm package
        run: >
          ./gradlew :datagsm-shared:assembleTsPackage
          -PSHARED_VERSION=${{ needs.generate-version.outputs.version }}
      - name: Publish to npmjs.com
        run: npm publish --access public
        working-directory: datagsm-shared/build/npm-ts

  deploy:
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'deploy-server' || inputs.target == 'both')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    uses: ./.github/workflows/datagsm-deploy.yaml
    with:
      environment: prod
      ref: ${{ inputs.branch || github.event.workflow_run.head_sha || 'master' }}
    secrets: inherit

  notify:
    runs-on: ubuntu-latest
    needs: [generate-version, publish-jvm, publish-js, deploy]
    if: |
      always() &&
      (needs.generate-version.result != 'skipped' || needs.deploy.result != 'skipped')

    steps:
      - name: Determine Status
        id: status
        run: |
          if [[ "${{ needs.generate-version.result }}" == "failure" ]] || \
             [[ "${{ needs.publish-jvm.result }}" == "failure" ]] || \
             [[ "${{ needs.publish-js.result }}" == "failure" ]] || \
             [[ "${{ needs.deploy.result }}" == "failure" ]]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "color=0xFF4C4C" >> "$GITHUB_OUTPUT"
          elif [[ "${{ needs.deploy.result }}" == "success" ]] || \
               [[ "${{ needs.publish-jvm.result }}" == "success" && "${{ needs.publish-js.result }}" == "success" ]]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "color=0x4CAF50" >> "$GITHUB_OUTPUT"
          else
            echo "status=cancelled" >> "$GITHUB_OUTPUT"
            echo "color=0xFFA500" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_INFORMATION_ALERT_CHANNEL_WEBHOOK }}
          status: ${{ steps.status.outputs.status }}
          color: ${{ steps.status.outputs.color }}
          title: "DataGSM Prod CD"
          description: |
            **Generate Version:** ${{ needs.generate-version.result }}
            **Publish JVM:** ${{ needs.publish-jvm.result }}
            **Publish JS:** ${{ needs.publish-js.result }}
            **Deploy:** ${{ needs.deploy.result }}
