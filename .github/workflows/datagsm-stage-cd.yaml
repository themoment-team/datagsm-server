name: DataGSM stage CD workflow

on:
  workflow_run:
    workflows: ["DataGSM CI Workflow"]
    types:
      - completed
    branches:
      - 'develop'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: false
        default: 'develop'
        type: string

# Never cancel a running deploy midway; a newer run waits in the queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    uses: ./.github/workflows/datagsm-deploy.yaml
    with:
      environment: stage
      ref: ${{ inputs.branch || github.event.workflow_run.head_sha || 'develop' }}
    secrets: inherit

  notify:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always() && needs.deploy.result != 'skipped'

    steps:
      - name: Determine Status
        id: status
        run: |
          if [[ "${{ needs.deploy.result }}" == "failure" ]]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "color=0xFF4C4C" >> "$GITHUB_OUTPUT"
          elif [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "color=0x4CAF50" >> "$GITHUB_OUTPUT"
          else
            echo "status=cancelled" >> "$GITHUB_OUTPUT"
            echo "color=0xFFA500" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_INFORMATION_ALERT_CHANNEL_WEBHOOK }}
          status: ${{ steps.status.outputs.status }}
          color: ${{ steps.status.outputs.color }}
          title: "DataGSM Stage CD"
          description: |
            **Deploy:** ${{ needs.deploy.result }}
