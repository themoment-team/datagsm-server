name: DataGSM Deploy Workflow

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment (stage or prod)'
        required: true
        type: string
      ref:
        description: 'Git ref to deploy'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      PROFILE: ${{ inputs.environment }}
      SECRET_PREFIX: ${{ inputs.environment == 'prod' && 'PROD' || 'STAGE' }}
      MODULES: datagsm-oauth-authorization datagsm-openapi datagsm-web datagsm-oauth-userinfo

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-cleanup: always

      # Secrets go through env + printf so `$`, backticks and quotes in the YAML are written verbatim.
      - name: Make YML Files
        env:
          DATAGSM_OAUTH_AUTHORIZATION: ${{ secrets[format('{0}_OAUTH_AUTHORIZATION_APPLICATION_YAML', env.SECRET_PREFIX)] }}
          DATAGSM_OPENAPI: ${{ secrets[format('{0}_OPENAPI_APPLICATION_YAML', env.SECRET_PREFIX)] }}
          DATAGSM_WEB: ${{ secrets[format('{0}_WEB_APPLICATION_YAML', env.SECRET_PREFIX)] }}
          DATAGSM_OAUTH_USERINFO: ${{ secrets[format('{0}_OAUTH_USERINFO_APPLICATION_YAML', env.SECRET_PREFIX)] }}
        run: |
          for module in $MODULES; do
            var="${module//-/_}"
            var="${var^^}"
            mkdir -p "$module/src/main/resources"
            printf '%s\n' "${!var}" > "$module/src/main/resources/application-$PROFILE.yml"
          done
        shell: bash

      - name: Build with Gradle
        run: ./gradlew assemble

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Make ZIP File
        run: |
          for module in $MODULES; do
            mkdir -p "deploy-package/$module/build/libs"
            cp "$module"/build/libs/*.jar "deploy-package/$module/build/libs/"
            cp "$module/$PROFILE.dockerfile" "deploy-package/$module/"
          done

          cp "compose.$PROFILE.yaml" deploy-package/
          cp -r scripts deploy-package/
          cp appspec.yml deploy-package/

          cd deploy-package
          zip -r "../$GITHUB_SHA.zip" .
        shell: bash

      - name: Upload to S3
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          BUCKET: ${{ secrets.AWS_S3_BUCKET_NAME }}
        run: aws s3 cp --region "$AWS_REGION" "./$GITHUB_SHA.zip" "s3://$BUCKET/$PROFILE/$GITHUB_SHA.zip"

      - name: Code Deploy
        env:
          BUCKET: ${{ secrets.AWS_S3_BUCKET_NAME }}
        run: >
          aws deploy create-deployment
          --application-name "datagsm-$PROFILE-server-codedeploy"
          --deployment-config-name CodeDeployDefault.AllAtOnce
          --deployment-group-name "datagsm-$PROFILE-server"
          --s3-location "bucket=$BUCKET,bundleType=zip,key=$PROFILE/$GITHUB_SHA.zip"
