name: DataGSM CI Workflow

on:
  # No branch filter: stacked PRs (based on another feature branch) must be verified too.
  pull_request:
  push:
    branches:
      - 'develop'
      - 'master'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-title:
    # Dependabot titles cannot follow the [scope] format.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Validation Script
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Validate PR Title
        uses: actions/github-script@v9
        with:
          script: |
            const validateTitle = require('./.github/scripts/validate-title.js');
            validateTitle({ core, title: context.payload.pull_request.title, allowVersion: true });

  setup-pr-metadata:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Setup PR Metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "waiting for review:검토 대기"
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-assignee "$PR_AUTHOR"
          ALL_REVIEWERS="wwwcomcomcomcom,ZaMan0806,hongjm0912"
          REVIEWERS=$(echo "$ALL_REVIEWERS" | tr ',' '\n' | grep -v "^${PR_AUTHOR}$" | tr '\n' ',' | sed 's/,$//')
          if [ -n "$REVIEWERS" ]; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-reviewer "$REVIEWERS"
          fi

  build-and-test:
    runs-on: ubuntu-latest
    needs: [validate-title]
    if: always() && (needs.validate-title.result == 'success' || needs.validate-title.result == 'skipped')
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-cleanup: always

      - name: Build and Test with Gradle
        run: ./gradlew build koverXmlReport --parallel --build-cache

      - name: Publish Test Report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '**/build/test-results/test/*.xml'
          annotate_only: true
          detailed_summary: true

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

      - name: Comment Coverage on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: ${{ github.workspace }}/build/reports/kover/report.xml
          token: ${{ github.token }}
          title: Kover Coverage
          update-comment: true
          continue-on-error: true

      - name: Assemble type-only npm package
        run: ./gradlew :datagsm-shared:assembleTsPackage --build-cache

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Type-check generated index.d.ts
        run: npx -y -p typescript@5 tsc --strict --noEmit datagsm-shared/build/npm-ts/index.d.ts

  notify:
    runs-on: ubuntu-latest
    needs: [validate-title, setup-pr-metadata, build-and-test]
    # Dependabot runs cannot read the Discord webhook secret.
    if: always() && github.event.pull_request.user.login != 'dependabot[bot]'

    steps:
      - name: Determine Status
        id: status
        run: |
          if [[ "${{ needs.validate-title.result }}" == "failure" ]] || \
             [[ "${{ needs.build-and-test.result }}" == "failure" ]]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "color=0xFF4C4C" >> "$GITHUB_OUTPUT"
          elif [[ "${{ needs.build-and-test.result }}" == "success" ]]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "color=0x4CAF50" >> "$GITHUB_OUTPUT"
          else
            echo "status=cancelled" >> "$GITHUB_OUTPUT"
            echo "color=0xFFA500" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_INFORMATION_ALERT_CHANNEL_WEBHOOK }}
          status: ${{ steps.status.outputs.status }}
          color: ${{ steps.status.outputs.color }}
          title: "DataGSM CI (${{ github.base_ref || github.ref_name }})"
          description: |
            **Validate Title:** ${{ needs.validate-title.result }}
            **Setup Metadata:** ${{ needs.setup-pr-metadata.result }}
            **Build & Test:** ${{ needs.build-and-test.result }}
