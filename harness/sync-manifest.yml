# 정리가 완료된 항목은 이 목록에서 제거해도 됩니다
#
# 예시:
#   deletions:
#     - dest: .claude/skills/old-skill-name/
#       reason: "new-skill-name 으로 이름 변경"
#       since: "2026-05-29"
deletions:
  - dest: .claude/skills/nextjs-turborepo-fsd/
    reason: "nextjs-fsd-architecture v2의 Turborepo 절로 통합"
    since: "2026-11-12"
  - dest: .agents/skills/nextjs-turborepo-fsd/
    reason: "nextjs-fsd-architecture v2의 Turborepo 절로 통합"
    since: "2026-11-12"
